<head>
        <meta charset="UTF-8">
    <link rel="stylesheet" href="formulario.css">
</head>
<body>
<div id="formulario" class="formulario">

    <form id="form-contato">

        <h2 class="form-h1">Envie sua proposta</h2>

        <input
            id="nome"
            class="form-input"
            type="text"
            placeholder="Seu nome"
            required
        >

        <br>

        <input
            id="email"
            class="form-input"
            type="email"
            placeholder="Seu e-mail"
            required
        >

        <br>

        <textarea
            id="mensagem"
            name="mensagem"
            class="textarea"
            placeholder="Sua mensagem"
            required
        ></textarea>

        <br>

        <button
            type="submit"
            id="enviar"
            class="form-B"
        >
            Enviar
        </button>

    </form>

</div>

<script src="Javascript.js"></script>
    
</body>
